name: Prueba tokens

on:
  push:

jobs:
  comprobar-tokens:
    runs-on: self-hosted

    env:
      DEV_TOKEN: ${{ secrets.DEV_TOKEN }}

    steps:
      - name: Comparar tokens
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Los tokens coinciden"
          }
          else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }