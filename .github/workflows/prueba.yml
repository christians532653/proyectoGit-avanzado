name: Prueba tokens

on:
  push:

jobs:
  comprobar-tokens:
    runs-on: self-hosted

    env:
      DEV_TOKEN: ${{ secrets.DEV_TOKEN }}

    steps:
      - name: Comparar tokens
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $devCorrecto = $env:DEV_TOKEN -eq "DEV-123456"
          $localCorrecto = $env:LOCAL_DEV_TOKEN -eq "DEV-123456"

          Write-Host "DEV_TOKEN de GitHub correcto: $devCorrecto"
          Write-Host "LOCAL_DEV_TOKEN local correcto: $localCorrecto"