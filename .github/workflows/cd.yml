name: CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  updatereadme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Incrementar versión
        run: |
          VERSION=$(grep -o 'AppVersion-[0-9]*' README.md | head -1 | cut -d- -f2)
          NEW_VERSION=$((VERSION + 1))
          sed -i "s/AppVersion-$VERSION/AppVersion-$NEW_VERSION/" README.md
          echo "Fecha y hora: $(date '+%Y-%m-%d %H:%M:%S')" >> README.md

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Incrementar versión"
          git push

  validate-prod:
    runs-on: self-hosted
    needs: updatereadme

    steps:
      - name: Validar PROD_TOKEN
        shell: cmd
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if "%PROD_TOKEN%"=="%LOCAL_PROD_TOKEN%" (
            echo Los tokens coinciden
          ) else (
            echo Los tokens NO coinciden
            exit /b 1
          )
